# Chytai web platform (library, Discovery, recommendations): a separate Fly app from the reader,
# so the mobile WebView and the reader stay as they are. Deploy from the repo root:
#   flyctl deploy . --remote-only -a chytai-web -c web/fly.toml --dockerfile web/Dockerfile
# Secrets: RESEND_API_KEY (sign-in codes by mail), WEB_LOGIN_TOKEN (the owner's old magic link, optional).
app = "chytai-web"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  DATA_DIR = "/data"
  TZ = "Europe/Kyiv"
  PORT = "8080"
  WEB_DOMAIN = "chytai.org.ua"
  # Past this a process dies and is started again, instead of hanging in garbage collection (2026-10-19).
  NODE_OPTIONS = "--max-old-space-size=420"

[[mounts]]
  source = "web_data"
  destination = "/data"
  initial_size = "1gb"

[http_service]
  internal_port = 8080
  force_https = true
  # One machine always on (Max 2026-10-20): a stopped machine took ~5 s to wake for the first visitor.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

# 512 MB since 2026-10-21 (Max OK): with ~16 thousand catalog books a refresh no longer fit in 256 MB.
# 2 CPUs and 1 GB since 2026-10-24 (Max chose it): the site and the background jobs are two processes
# (web/main.js), each with its own copy of the catalog, and a third for a moment while the site reloads.
[[vm]]
  size = "shared-cpu-2x"
  memory = "1gb"
