# The web platform (web/) deploys to https://chytai-web.fly.dev on every push to main that touches it.
# Needs the repo secret FLY_API_TOKEN_WEB: a deploy token for the app chytai-web
#   fly tokens create deploy -a chytai-web
# First deploy done by hand from Max's Mac on 2026-10-18; this keeps it in sync with main.
name: Deploy web

on:
  push:
    branches: [main]
    paths: ["web/**", "server/agent.js", "server/aimeter.js", "build/icon.png", ".github/workflows/web.yml", "scripts/perf-check.sh", "scripts/smoke-test.sh", "scripts/deploy-probe.sh", "scripts/hot-deploy.sh"]
  workflow_dispatch:

jobs:
  # Several threads push small fixes minutes apart (Max, 2026-10-22: «деплой йде довше ніж наступний фікс
  # зробити»): a push waits 30 quiet seconds, and a newer push cancels the waiting one, so a burst of
  # commits goes out as one deploy of the newest. (2 minutes until 2026-10-22: too long next to a one-minute deploy.)
  # The smoke test (scripts/smoke-test.sh, Max 2026-11-04) runs here too: it takes about as long as the quiet
  # wait did, and a page that breaks stops the deploy before it reaches readers. With the repo secret
  # CHYTAI_BACKUP_KEY (the backup age key's text) it runs on last night's scrubbed test copy of the database,
  # without it on an empty one.
  settle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency: { group: web-settle, cancel-in-progress: true }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci --prefix web --omit=dev --ignore-scripts --no-audit --no-fund
      - run: scripts/install-age.sh || echo "::warning::no age, so the smoke test runs on an empty database"
      - name: Smoke test
        env:
          KEY: ${{ secrets.CHYTAI_BACKUP_KEY }}
        run: |
          if [ -n "$KEY" ] && command -v age >/dev/null; then printf '%s\n' "$KEY" > "$RUNNER_TEMP/age.key"; export CHYTAI_BACKUP_KEY="$RUNNER_TEMP/age.key"; fi
          scripts/smoke-test.sh
  deploy:
    needs: settle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      # What to go back to: the image, or after a deploy without a restart the commit that ran before (hot:<sha>).
      image: ${{ steps.hot.outputs.result == 'ok' && format('hot:{0}', steps.before.outputs.commit) || steps.before.outputs.image }}
      since: ${{ steps.before.outputs.since }}
    # One deploy at a time; a newer one waiting replaces an older one waiting (never one mid-deploy).
    concurrency: deploy-web
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      # The image running now, to go back to if the post-release check below fails.
      - id: before
        run: |
          echo "image=$(flyctl machine list -a chytai-web --json | jq -r '.[0].config.image // empty')" >> "$GITHUB_OUTPUT"
          echo "since=$(date -u +%FT%T.000Z)" >> "$GITHUB_OUTPUT"
          echo "commit=$(curl -s -m 20 https://chytai.org.ua/agent/health -H "Authorization: $FLY_API_TOKEN" | jq -r '.commit // empty')" >> "$GITHUB_OUTPUT"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_WEB }}
      # The data volume at 3 GB at least (2026-10-28, Max OK: 1 GB was filling ~40 MB a day with kept covers).
      # Grows only, so it does nothing once done; the deploy below restarts the machine onto the new size.
      - run: |
          flyctl volumes list -a chytai-web --json | jq -r '.[] | select(.name == "web_data" and .size_gb < 3) | .id' |
            while read -r id; do flyctl volumes extend "$id" -s 3 -a chytai-web --yes || echo "could not extend $id"; done
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_WEB }}
      # The deploy log (Max, 2026-11-16): a probe asks the site every second until the check below is done, and
      # tells /agent/deploys how long a visitor got no answer (scripts/deploy-probe.sh, /admin/speed «Деплої»).
      - run: scripts/deploy-probe.sh start
      # A deploy without a restart first (web/release.js, Max 2026-11-16: «20, 30, 40 релізів на день», and the site
      # stays up): the site's files go to the volume, a fresh web process opens a few pages on them while the old one
      # answers, then takes over. «full» (web/package*.json, main.js or the Dockerfile changed, no ssh, a new image needed):
      # the image deploy below as before. «failed» (the new code's pages did not open): the old code stays, the run
      # fails. Off: repo variable HOT_DEPLOY=off.
      - id: hot
        if: vars.HOT_DEPLOY != 'off' && github.event_name == 'push'
        continue-on-error: true
        run: scripts/hot-deploy.sh ${{ github.sha }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_WEB }}
      - if: steps.hot.outputs.result == 'failed'
        run: |
          echo "::error::the new code did not open its pages (see the hot step); the site keeps the previous code"
          exit 1
      # The image is built here on the GitHub runner and pushed to Fly (Max, 2026-10-29: «треба дивитися чому
      # вони так тормозять»): Fly's Depot builder kept deploys «Waiting for depot builder» 2-10 minutes that
      # day, for a build that takes about one. Fly's builders stay as the fallback. Fly's API sometimes drops
      # the connection after the build ("unexpected EOF") or hangs after the push (16 minutes on 2026-10-21,
      # holding up every deploy queued behind it): each try gets 5 minutes.
      # Layers that did not change keep their digest (Max, 2026-11-16, a shorter pause): the image is built with
      # GitHub's build cache, so the system packages and node_modules are the very layers the machine already has
      # and Fly pulls only the code (~20 MB) while the site is down. Any trouble here: the builds below as before.
      - if: steps.hot.outputs.result != 'ok'
        uses: docker/setup-buildx-action@v3
        continue-on-error: true
      - id: login
        if: steps.hot.outputs.result != 'ok'
        continue-on-error: true
        run: flyctl auth docker
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_WEB }}
      - id: build
        if: steps.hot.outputs.result != 'ok' && steps.login.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 8
        uses: docker/build-push-action@v6
        with:
          context: .
          file: web/Dockerfile
          push: true
          provenance: false
          tags: registry.fly.io/chytai-web:gh-${{ github.sha }}
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
      - if: steps.hot.outputs.result != 'ok'
        run: |
          deploy() { timeout 300 flyctl deploy . -a chytai-web -c web/fly.toml --dockerfile web/Dockerfile --build-arg GIT_SHA=${{ github.sha }} "$@"; }
          if [ "${{ steps.build.outcome }}" = success ]; then
            timeout 300 flyctl deploy -a chytai-web -c web/fly.toml --image registry.fly.io/chytai-web:gh-${{ github.sha }} && exit 0
            echo "the cached image did not go out; building as before"
          fi
          deploy --local-only || { echo "retrying on Fly's Depot builder"; deploy --remote-only; } || { echo "retrying on Fly's own builder"; deploy --remote-only --depot=false; }
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_WEB }}
      # The first visit after a deploy starts the daily catalog refresh if one is due; its state, once.
      - run: curl -s -m 20 https://chytai.org.ua/refresh-status | cut -c1-300 || true
      # Post-release check (Max, 2026-10-21): the main pages must answer in 1.5 s. If not, the previous
      # image goes back and the run fails, so GitHub mails it; the commit stays on main to be fixed.
      - id: check
        run: scripts/perf-check.sh 1.5
      - if: failure() && steps.check.outcome == 'failure' && steps.before.outputs.image != ''
        run: |
          if [ "${{ steps.hot.outputs.result }}" = ok ] && [ -n "${{ steps.before.outputs.commit }}" ]; then
            echo "rolling back to ${{ steps.before.outputs.commit }} (no restart)"
            scripts/hot-deploy.sh "${{ steps.before.outputs.commit }}" | tee "$RUNNER_TEMP/back"
            grep -q "hot deploy: ok" "$RUNNER_TEMP/back" || flyctl deploy -a chytai-web -c web/fly.toml --image "${{ steps.before.outputs.image }}"
          else
            echo "rolling back to ${{ steps.before.outputs.image }}"
            flyctl deploy -a chytai-web -c web/fly.toml --image "${{ steps.before.outputs.image }}"
          fi
          scripts/perf-check.sh 1.5 || true
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_WEB }}
      - if: always()
        run: scripts/deploy-probe.sh stop ${{ github.sha }} ${{ steps.hot.outputs.result == 'ok' && 'hot' || 'probe' }}
        env:
          SITE_TOKEN: ${{ secrets.FLY_API_TOKEN_WEB }}
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_WEB }}
      # The domain (Max, 2026-10-19): chytai.org.ua serves the site; www and chytai-web.fly.dev redirect to it.
      - run: |
          for u in https://chytai.org.ua/ https://www.chytai.org.ua/ https://chytai-web.fly.dev/; do curl -sS -o /dev/null -w "$u: %{http_code} %{redirect_url}\n" "$u" || true; done
  # The rollout watch (scripts/rollout-watch.sh, Max 2026-11-09): 15 minutes after a good deploy, new errors seen
  # twice send a line to Telegram. Rollback
  # only on [rollback-on-errors] in the commit message or repo variable ROLLOUT_ROLLBACK=always (Max 2026-11-09). Its own job, so it holds up no deploy; a newer
  # deploy cancels it.
  watch:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency: { group: web-watch, cancel-in-progress: true }
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: scripts/rollout-watch.sh chytai-web "${{ needs.deploy.outputs.since }}" "${{ needs.deploy.outputs.image }}"
        env:
          SHA: ${{ github.sha }}
          ROLLBACK: ${{ (contains(github.event.head_commit.message, '[rollback-on-errors]') || vars.ROLLOUT_ROLLBACK == 'always') && '1' || '' }}
          SITE_TOKEN: ${{ secrets.FLY_API_TOKEN_WEB }}
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_WEB }}
