# The web platform (web/) deploys to https://chytai-web.fly.dev on every push to main that touches it.
# Needs the repo secret FLY_API_TOKEN_WEB: a deploy token for the app chytai-web
#   fly tokens create deploy -a chytai-web
# First deploy done by hand from Max's Mac on 2026-10-18; this keeps it in sync with main.
name: Deploy web

on:
  push:
    branches: [main]
    paths: ["web/**", "package.json", "package-lock.json", ".github/workflows/web.yml"]
  workflow_dispatch:

concurrency: deploy-web

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      # Fly's API sometimes drops the connection after the image is built ("unexpected EOF"); one retry
      # redeploys the already-built image.
      - run: |
          deploy() { flyctl deploy . --remote-only -a chytai-web -c web/fly.toml --dockerfile web/Dockerfile; }
          deploy || { echo "retrying deploy"; sleep 15; deploy; }
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_WEB }}
      # The first visit after a deploy starts the daily catalog refresh; show whether it worked.
      - run: |
          curl -s -o /dev/null https://chytai-web.fly.dev/ || true
          for i in 1 2 3 4 5 6; do sleep 15; s=$(curl -s https://chytai-web.fly.dev/refresh-status); echo "$s"; echo "$s" | grep -q '"running":false' && break; done
      # The domain (Max, 2026-10-19: the web lives at chytai.org.ua). Certificates are idempotent to add;
      # DNS at nic.ua: A/AAAA for the apex and www (from `ips list`) and the _acme-challenge CNAMEs to flydns.net
      # that `certs setup` prints. A deploy token may lack the rights for this, so it never fails the run.
      - run: |
          for d in chytai.org.ua www.chytai.org.ua; do flyctl certs add "$d" -a chytai-web || true; done
          flyctl ips list -a chytai-web || true
          flyctl certs list -a chytai-web || true
          for d in chytai.org.ua www.chytai.org.ua; do flyctl certs check "$d" -a chytai-web || true; done
          for i in 1 2 3 4 5 6 7 8; do
            curl -sS -o /dev/null https://chytai.org.ua/ && break
            sleep 20; flyctl certs check chytai.org.ua -a chytai-web 2>&1 | grep -i status || true
          done
          for d in chytai.org.ua www.chytai.org.ua; do curl -sS -o /dev/null -w "$d: %{http_code} %{redirect_url}\n" "https://$d/" || true; done
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_WEB }}
