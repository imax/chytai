# The web platform (web/) deploys to https://chytai-web.fly.dev on every push to main that touches it.
# Needs the repo secret FLY_API_TOKEN_WEB: a deploy token for the app chytai-web
#   fly tokens create deploy -a chytai-web
# First deploy done by hand from Max's Mac on 2026-10-18; this keeps it in sync with main.
name: Deploy web

on:
  push:
    branches: [main]
    paths: ["web/**", "package.json", "package-lock.json", ".github/workflows/web.yml", "scripts/perf-check.sh"]
  workflow_dispatch:

jobs:
  # Several threads push small fixes minutes apart (Max, 2026-10-22: «деплой йде довше ніж наступний фікс
  # зробити»): a push waits 30 quiet seconds, and a newer push cancels the waiting one, so a burst of
  # commits goes out as one deploy of the newest. (2 minutes until 2026-10-22: too long next to a one-minute deploy.)
  settle:
    runs-on: ubuntu-latest
    concurrency: { group: web-settle, cancel-in-progress: true }
    steps:
      - run: sleep 30
  deploy:
    needs: settle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # One deploy at a time; a newer one waiting replaces an older one waiting (never one mid-deploy).
    concurrency: deploy-web
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      # The image running now, to go back to if the post-release check below fails.
      - id: before
        run: echo "image=$(flyctl machine list -a chytai-web --json | jq -r '.[0].config.image // empty')" >> "$GITHUB_OUTPUT"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_WEB }}
      # The data volume at 3 GB at least (2026-10-28, Max OK: 1 GB was filling ~40 MB a day with kept covers).
      # Grows only, so it does nothing once done; the deploy below restarts the machine onto the new size.
      - run: |
          flyctl volumes list -a chytai-web --json | jq -r '.[] | select(.name == "web_data" and .size_gb < 3) | .id' |
            while read -r id; do flyctl volumes extend "$id" -s 3 -a chytai-web --yes || echo "could not extend $id"; done
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_WEB }}
      # Fly's API sometimes drops the connection after the image is built ("unexpected EOF") or hangs after
      # pushing it (16 minutes on 2026-10-21, holding up every deploy queued behind it): each try gets 5
      # minutes, and one retry redeploys the already-built image.
      - run: |
          deploy() { timeout 300 flyctl deploy . --remote-only -a chytai-web -c web/fly.toml --dockerfile web/Dockerfile; }
          deploy || { echo "retrying deploy"; sleep 15; deploy; }
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_WEB }}
      # The first visit after a deploy starts the daily catalog refresh if one is due; its state, once.
      - run: curl -s -m 20 https://chytai.org.ua/refresh-status | cut -c1-300 || true
      # Post-release check (Max, 2026-10-21): the main pages must answer in 1.5 s. If not, the previous
      # image goes back and the run fails, so GitHub mails it; the commit stays on main to be fixed.
      - id: check
        run: scripts/perf-check.sh 1.5
      - if: failure() && steps.check.outcome == 'failure' && steps.before.outputs.image != ''
        run: |
          echo "rolling back to ${{ steps.before.outputs.image }}"
          flyctl deploy -a chytai-web -c web/fly.toml --image "${{ steps.before.outputs.image }}"
          scripts/perf-check.sh 1.5 || true
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_WEB }}
      # The domain (Max, 2026-10-19): chytai.org.ua serves the site; www and chytai-web.fly.dev redirect to it.
      - run: |
          for u in https://chytai.org.ua/ https://www.chytai.org.ua/ https://chytai-web.fly.dev/; do curl -sS -o /dev/null -w "$u: %{http_code} %{redirect_url}\n" "$u" || true; done
