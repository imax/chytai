# Keeps https://chytai.org.ua up (Max, 2026-10-21: «давай далі тримати це на контролі»). Every 5 minutes
# this asks the site for a light page; if it does not answer three times in a row (a hung process: a CPU
# loop took the site down for 50 minutes that day), it restarts the Fly machine and fails, so GitHub mails
# the failure. A page that answers but slowly is only printed.
name: Uptime

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency: uptime

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - id: ping
        run: |
          for i in 1 2 3; do
            out=$(curl -s -o /dev/null -m 20 -w "%{http_code} %{time_total}" https://chytai.org.ua/publishers || echo "000 20")
            echo "try $i: $out"
            if [ "${out%% *}" = "200" ]; then echo "up=true" >> "$GITHUB_OUTPUT"; exit 0; fi
            sleep 20
          done
          echo "up=false" >> "$GITHUB_OUTPUT"
      - if: steps.ping.outputs.up == 'false'
        uses: superfly/flyctl-actions/setup-flyctl@master
      - if: steps.ping.outputs.up == 'false'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_WEB }}
        run: |
          id=$(flyctl machine list -a chytai-web --json | jq -r '.[0].id')
          echo "site down, restarting machine $id"
          flyctl machine restart "$id" -a chytai-web
          sleep 20
          curl -s -o /dev/null -m 30 -w "after restart: %{http_code} %{time_total}s\n" https://chytai.org.ua/publishers || echo "after restart: no answer"
          exit 1
