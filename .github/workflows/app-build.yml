# A new native build of the iPhone app, built on EAS and sent straight to TestFlight.
# Run it by hand (Actions → App build → Run workflow) when the native side changes or a
# TestFlight build is about to expire (they live 90 days). Day-to-day changes to app/ do not need
# this: app-update.yml ships them over the air.
#
# Needs the repo secret EXPO_TOKEN. Apple signing and the App Store Connect key are stored on
# EAS after the first interactive `eas build` / `eas submit` from Max's Mac, so CI runs
# non-interactively from then on.
name: App build (TestFlight)

on:
  workflow_dispatch:

concurrency: app-build

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci --no-audit --no-fund
      - run: eas build --platform ios --profile production --auto-submit --non-interactive --no-wait
