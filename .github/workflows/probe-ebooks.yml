name: probe-ebooks
on:
  push:
    branches: [claude/project-thread-67hweb]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (Macintosh; Intel Mac OS X 14_0) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/129 Safari/537.36"
          for u in https://nashformat.ua/ https://laboratory.ua/ https://meridiancz.com/ https://vikhola.com/ https://vivat.com.ua/ https://stonepublishing.com.ua/ https://bookchef.ua/ https://ababahalamaha.com.ua/ https://apriori.lviv.ua/ https://komorabooks.com/ https://osnovypublishing.com/ https://www.lobster.net.ua/ https://nebopublishing.com.ua/ https://folio.com.ua/ https://bohdan-books.com/ https://starylev.com.ua/ https://ksd.ua/ https://knigolove.ua/ https://www.ranok.com.ua/ https://zhorzh.com.ua/ https://artbooks.ua/ https://abuk.com.ua/ https://tamaryn.com.ua/ https://komubuk.com.ua/ https://vavylonska.com.ua/ https://choven.ua/ https://arthuss.com.ua/ https://antonenko-publishing.com/; do
            echo "=== $u"
            curl -sL -m 25 -A "$UA" -o /tmp/p.html -w "%{http_code} %{url_effective}\n" "$u"
            grep -oiE 'href="[^"]*(elektron|e-book|ebook|epub|ebooks|електрон|digital|cyfrov|tsyfrov)[^"]*"' /tmp/p.html | sort -u | head -8
            echo -n "words: "; grep -oiE 'електронн[а-яії]+|e-book|epub|PocketBook|Google Play|Apple Books|yakaboo|mobi\b' /tmp/p.html | tr 'A-ZА-Я' 'a-zа-я' | sort | uniq -c | tr '\n' ' '; echo
            curl -s -m 15 -A "$UA" "${u%/}/robots.txt" | grep -iE "^(user-agent: \*|disallow: /$)" | head -3
          done
