# One-off (КСД thread): print chytai.org.ua/refresh-status and the КСД shelf count. Branch only.
name: Probe KSD
on:
  push:
    branches: [claude/project-thread-55zhz1]
jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -s https://chytai.org.ua/refresh-status | jq '{running, last: (.last // {} | {started, finished, ok, errors, log: ((.log // [])[-12:])}), log: ((.log // [])[-8:]), shelvesFetched}'
          curl -s https://chytai.org.ua/publishers/ksd | grep -o "[0-9 ]* книж[^<]*" | head -3
