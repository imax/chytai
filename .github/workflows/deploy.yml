# Every change merged into main goes live on https://chytai.fly.dev.
# Needs the repo secret FLY_API_TOKEN: a deploy token limited to this one app
#   fly tokens create deploy -a chytai | gh secret set FLY_API_TOKEN -R imax/chytai
name: Deploy

on:
  push:
    branches: [main]
    paths-ignore: ["README.md", "scripts/**", "app/**", "web/**", ".github/workflows/app-*.yml", ".github/workflows/web.yml", ".github/workflows/backup.yml"]
  workflow_dispatch:

concurrency: deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only -a chytai
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
