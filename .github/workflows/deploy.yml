# Every change merged into main goes live on https://chytai.fly.dev.
# Needs the repo secret FLY_API_TOKEN: a deploy token limited to this one app
#   fly tokens create deploy -a chytai | gh secret set FLY_API_TOKEN -R imax/chytai
name: Deploy

on:
  push:
    branches: [main]
    paths-ignore: ["README.md", "docs/**", "scripts/**", "app/**", "web/**", ".github/workflows/app-*.yml", ".github/workflows/web.yml", ".github/workflows/backup.yml"]
  workflow_dispatch:

concurrency: deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.before.outputs.image }}
      since: ${{ steps.before.outputs.since }}
    steps:
      - uses: actions/checkout@v4
      # Smoke test first (Max, 2026-11-04): a missing file or a reader that does not start stops the deploy.
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --omit=dev --ignore-scripts --no-audit --no-fund
      - run: scripts/smoke-reader.sh
      - uses: superfly/flyctl-actions/setup-flyctl@master
      # The image running now and the time, for the rollout watch below.
      - id: before
        run: |
          echo "image=$(flyctl machine list -a chytai --json | jq -r '.[0].config.image // empty')" >> "$GITHUB_OUTPUT"
          echo "since=$(date -u +%FT%T.000Z)" >> "$GITHUB_OUTPUT"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      # Built here on the GitHub runner, not on Fly's Depot builder, which kept deploys waiting for minutes and
      # failed one on 2026-10-29 (Max: «треба дивитися чому вони так тормозять»); Fly's builder is the fallback.
      - run: |
          timeout 600 flyctl deploy --local-only -a chytai --build-arg GIT_SHA=${{ github.sha }} || { echo "retrying on Fly's builder"; flyctl deploy --remote-only -a chytai --build-arg GIT_SHA=${{ github.sha }}; }
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
  # The rollout watch (scripts/rollout-watch.sh, Max 2026-11-09): 15 minutes after the deploy, new reader errors
  # (the site keeps them) seen twice send the previous image back and a line to Telegram. A newer deploy cancels it.
  watch:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency: { group: reader-watch, cancel-in-progress: true }
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: scripts/rollout-watch.sh chytai "${{ needs.deploy.outputs.since }}" "${{ needs.deploy.outputs.image }}"
        env:
          SHA: ${{ github.sha }}
          SITE_TOKEN: ${{ secrets.FLY_API_TOKEN_WEB }}
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
