# The Mac app (mac/, Swift + WKWebView since 2.0): mac/build.sh builds the universal app and Chytai.dmg on a macOS
# runner, the app opens the reader once (-selftest) to show it loads and its service worker works, and on main the
# DMG goes out as the GitHub Release mac-v<version>; https://chytai.org.ua/mac points at
# releases/latest/download/Chytai.dmg. A new release only when the version in mac/Info.plist is new, so bump it.
# Any other branch gets the pre-release «mac-beta» (one, replaced each time) to try before release.
# Not signed for now (Max, 2026-11-02): ad-hoc signature, people allow it once in System Settings.
name: Mac app

on:
  push:
    branches: [main, "claude/**"]
    paths: ["mac/**", ".github/workflows/mac.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-latest
    timeout-minutes: 20
    concurrency: mac-dmg
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          v=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' mac/Info.plist)
          echo "tag=mac-v$v" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF" != refs/heads/main ]; then echo "tag=mac-beta" >> "$GITHUB_OUTPUT"
          elif gh release view "mac-v$v" >/dev/null 2>&1; then echo "exists=1" >> "$GITHUB_OUTPUT"; fi
        env:
          GH_TOKEN: ${{ github.token }}
      - if: steps.v.outputs.exists != '1'
        run: mac/build.sh
      - if: steps.v.outputs.exists != '1'
        name: Open the reader once
        run: |
          du -sh mac/build/Chytai.app mac/build/Chytai.dmg
          out=$(mac/build/Chytai.app/Contents/MacOS/Chytai -selftest YES 2>/dev/null | grep '^selftest:' || true)
          echo "$out"
          echo "$out" | grep -q '"mac":true'
          echo "$out" | grep -q '"swReady":true'
      - if: steps.v.outputs.exists != '1' && github.ref != 'refs/heads/main'
        run: |
          gh release delete mac-beta --cleanup-tag -y 2>/dev/null || true
          gh release create mac-beta mac/build/Chytai.dmg --target "$GITHUB_SHA" --prerelease --latest=false --title "Chytai для Mac, тестова збірка" --notes "Тестова збірка з гілки ${GITHUB_REF_NAME}, ${GITHUB_SHA::7}."
        env:
          GH_TOKEN: ${{ github.token }}
      - if: steps.v.outputs.exists != '1' && github.ref == 'refs/heads/main'
        run: |
          gh release create "${{ steps.v.outputs.tag }}" mac/build/Chytai.dmg --title "Chytai для Mac ${{ steps.v.outputs.tag }}" --notes "Читалка Chytai для Mac (Apple Silicon і Intel). Завантаження: https://chytai.org.ua/mac" --latest
        env:
          GH_TOKEN: ${{ github.token }}
