# Nightly backup of both apps' Fly volumes (Max, 2026-10-19): the web database (chytai-web, /data/web/chytai.db)
# and the reader's state (chytai, /data: positions, notes, uploaded books). Each copy is taken on the machine by
# scripts/backup-snapshot.js, checked here (SQLite integrity, JSON parses), encrypted with age to the public key
# below and kept as a workflow artifact for 90 days, off Fly. Fly's own daily volume snapshots are the second copy.
# The private key is NOT in the repo: it is on Max's Mac (~/Projects/chytai/.backup-key) and in the project files.
# Restore: see "Backups" in README.md.
# Every night the copy is also restored on trial (scripts/backup-restore-check.sh: the artifact downloaded back,
# decrypted with the private key from the repo secret CHYTAI_BACKUP_KEY, the app started on it), and each job tells
# the site how it went (POST /agent/backup, web/backups.js): a failure goes to Max's Telegram at once, and a day
# with no good copy by noon Kyiv too (Max, 2026-11-11, after a night's backup was lost and nobody knew).
# The site's own covers (web/covers, ~140 MB that seldom change) go apart, once a week on Sunday night, so the nightly
# copy stays the size of the database (Max, 2026-11-11: «поки у нас маленький сайт і база, то і бекап теж має бути
# маленьким, а ці великі штуки винесемо окремо»). The small copies (covers/t) and list pictures (covers/og) are made
# again by the site and are not kept at all.
name: Backup

on:
  schedule:
    - cron: "30 0 * * *" # 03:30 Kyiv: the site's database and the reader
    - cron: "0 1 * * 0" # Sunday 04:00 Kyiv: the site's covers
  workflow_dispatch:
  # A change to the backup itself runs it once, so it is tested right away.
  push:
    branches: [main]
    paths: [".github/workflows/backup.yml", "scripts/backup-snapshot.js", "scripts/test-db-scrub.py", "scripts/backup-restore-check.sh"]

# contents: write for the test copy's release (below).
permissions:
  contents: write

concurrency:
  group: backup
  cancel-in-progress: true

env:
  AGE_RECIPIENT: age1hv4fyt42a9wjuhh4dtkrdjle8xz6tlk3t0duf2c5a2lqszwmtd6q9q0pfw

jobs:
  # Which copies this run takes: the nightly schedule the database and the reader, the Sunday one the covers,
  # a push or «Run workflow» all three.
  plan:
    runs-on: ubuntu-latest
    outputs:
      copies: ${{ steps.plan.outputs.copies }}
    steps:
      - id: plan
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          # app: the name of the copy (artifact, report); fly: the Fly app; dir: what is packed; exclude: left out of it.
          all='[
            {"app": "chytai-web", "fly": "chytai-web", "token": "FLY_API_TOKEN_WEB", "url": "https://chytai.org.ua", "dir": "/data",
             "exclude": "web/covers", "keep": 90},
            {"app": "chytai", "fly": "chytai", "token": "FLY_API_TOKEN", "url": "https://chytai.fly.dev", "dir": "/data",
             "exclude": "reflow *.epub *.pdf */reflow covers/*.*", "keep": 90},
            {"app": "chytai-web-covers", "fly": "chytai-web", "token": "FLY_API_TOKEN_WEB", "url": "https://chytai.org.ua", "dir": "/data/web/covers",
             "exclude": "t og", "keep": 35}
          ]'
          # The reader leaves out the readers' book files (Max, 2026-11-06: «це ж не наші книжки»): their notes, places and
          # settings are in reader.db; the files are in Fly's daily volume snapshots (30 days). reflow is rebuilt from the
          # books on demand, and so are the covers taken out of the books (covers/*.*, 560 MB); readers' own covers stay.
          case "$SCHEDULE" in
            "30 0 * * *") pick='map(select(.app != "chytai-web-covers"))' ;;
            "0 1 * * 0") pick='map(select(.app == "chytai-web-covers"))' ;;
            *) pick='.' ;;
          esac
          echo "copies=$(echo "$all" | jq -c "$pick")" >> "$GITHUB_OUTPUT"
  backup:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.copies) }}
    env:
      APP: ${{ matrix.app }}
      FLY_APP: ${{ matrix.fly }}
      FLY_API_TOKEN: ${{ secrets[matrix.token] }}
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: sudo apt-get install -y age >/dev/null
      # Each copy has its own files in /tmp: the site's database and its covers are taken from one machine, at the same
      # time on a push (2026-11-11 the two shared /tmp/backup.tar.gz, and the site's copy came down as the covers).
      # The machines sleep when nobody uses them (and /tmp goes with them), so ping the site while this runs
      # and redo snapshot + download together if the machine stopped in between.
      - name: Snapshot on the machine
        id: snap
        run: |
          ( while true; do curl -s -o /dev/null "${{ matrix.url }}/" || true; sleep 5; done ) &
          id=$(flyctl machine list -a "$FLY_APP" --json | jq -r '[.[] | select(.config.mounts | length > 0)][0].id')
          echo "MACHINE=$id" >> "$GITHUB_ENV"
          script=$(base64 -w0 scripts/backup-snapshot.js)
          rm -f backup.tar.gz
          for i in 1 2 3; do
            flyctl machine start "$id" -a "$FLY_APP" || true
            flyctl machine wait "$id" -a "$FLY_APP" --state started --wait-timeout 60s || true
            # Packing the reader's books takes minutes now (2026-11-06): a 120 s cut left the first run going on the
            # machine, and the retry's copy came out with the database alone. Give it time.
            timeout 900 flyctl ssh console -a "$FLY_APP" --machine "$id" \
              -C "sh -c 'set -f; echo $script | base64 -d > /tmp/backup-snapshot-$APP.js && rm -f /tmp/backup-$APP.tar.gz && node /tmp/backup-snapshot-$APP.js ${{ matrix.dir }} /tmp/backup-$APP.tar.gz ${{ matrix.exclude }}'" \
              && timeout 600 flyctl ssh sftp get /tmp/backup-$APP.tar.gz backup.tar.gz -a "$FLY_APP" --machine "$id" \
              && break
            rm -f backup.tar.gz; echo "retrying"; sleep 10
          done
          test -s backup.tar.gz
          timeout 120 flyctl ssh console -a "$FLY_APP" --machine "$id" -C "rm -f /tmp/backup-$APP.tar.gz /tmp/backup-snapshot-$APP.js" || true
      - name: Check the copy
        id: check
        run: |
          mkdir check && tar xzf backup.tar.gz -C check
          du -sh check; find check -type f | sed 's|^check/||' | sort | head -50
          # What takes the room: by kind of file and the biggest ones (names of accounts' books are not printed).
          find check -type f -printf '%s\t%f\n' | awk -F'\t' '{n=split($2,a,"."); e=(n>1?a[n]:"(none)"); s[e]+=$1; c[e]++} END {for (e in s) printf "%8.1f MB %6d .%s\n", s[e]/1e6, c[e], e}' | sort -rn | head -15
          find check -type f -printf '%s\t%P\n' | sort -rn | head -15 | awk -F'\t' '{sub(/[^\/]*$/, "…", $2); printf "%8.1f MB %s\n", $1/1e6, $2}'
          du -m --max-depth=2 check | sort -rn | head -10
          # A copy with the database alone (the reader's on 2026-11-05 and 11-06) is not a backup.
          n=$(find check -type f | wc -l); echo "$n files"; echo "FILES=$n" >> "$GITHUB_ENV"
          # The reader's and the covers' hold many files (the reader's own covers), the site's a few beside its database.
          [ "$APP" = chytai-web ] || [ "$n" -ge 10 ] || { echo "::error::only $n files in the copy"; exit 1; }
          # And the copy is the one asked for: the database of the site, the reader's own.
          case "$APP" in
            chytai-web) want=check/web/chytai.db ;;
            chytai) want=check/reader.db ;;
            *) want= ;;
          esac
          [ -z "$want" ] || [ -s "$want" ] || { echo "::error::no ${want#check/} in the copy"; exit 1; }
          [ "$APP" != chytai-web-covers ] || [ ! -e check/web ] || { echo "::error::the covers' copy holds the site"; exit 1; }
          python3 - <<'PY'
          import json, pathlib, sqlite3, sys
          ok = True
          for p in pathlib.Path("check").rglob("*"):
              if p.suffix == ".db":
                  db = sqlite3.connect(p)
                  r = db.execute("PRAGMA integrity_check").fetchone()[0]
                  tables = [t for (t,) in db.execute("select name from sqlite_master where type='table' and name not like 'search%'")]
                  print(p, r, {t: db.execute(f'select count(*) from "{t}"').fetchone()[0] for t in tables})
                  ok &= r == "ok"
              elif p.suffix == ".json":
                  try: json.loads(p.read_text())
                  except Exception as e: print(p, "BAD JSON", e); ok = False
          sys.exit(0 if ok else 1)
          PY
      - name: Encrypt
        id: encrypt
        run: |
          name="$APP-$(date -u +%Y-%m-%d)"
          age -r "$AGE_RECIPIENT" -o "$name.tar.gz.age" backup.tar.gz
          ls -l "$name.tar.gz.age"
          echo "NAME=$name" >> "$GITHUB_ENV"
          echo "BYTES=$(stat -c %s "$name.tar.gz.age")" >> "$GITHUB_ENV"
      # A test copy of the site's database for threads and the Mac (Max, 2026-10-25): real emails, sessions,
      # tokens and secrets taken out (scripts/test-db-scrub.py), encrypted with the same key and published as
      # the asset of the release "test-db", replaced every night. Fetch it with scripts/fetch-test-db.sh.
      # The backup is kept before the test copy is made: a test copy that fails (2026-11-11, an address the
      # scrub missed) must not cost the night's backup.
      - uses: actions/upload-artifact@v4
        id: upload
        with:
          name: ${{ env.NAME }}
          path: ${{ env.NAME }}.tar.gz.age
          retention-days: ${{ matrix.keep }}
          compression-level: 0
      # The trial restore: the artifact as GitHub keeps it, back here, decrypted and started (see the top).
      - uses: actions/download-artifact@v4
        id: download
        with:
          name: ${{ env.NAME }}
          path: restored
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --omit=dev --ignore-scripts --no-audit --no-fund
      - name: Restore check
        id: restore
        timeout-minutes: 10
        env:
          KEY: ${{ secrets.CHYTAI_BACKUP_KEY }}
        run: |
          printf '%s\n' "$KEY" > "$RUNNER_TEMP/age.key"
          CHYTAI_BACKUP_KEY="$RUNNER_TEMP/age.key" scripts/backup-restore-check.sh "$APP" "restored/$NAME.tar.gz.age" backup.tar.gz
          rm -f "$RUNNER_TEMP/age.key"
      # Made even when the restore check failed: the backup is kept by then, and threads test on this copy.
      # The database every night; the covers (public pictures anyway, nothing to scrub) as their own asset weekly.
      - name: Test copy
        id: test
        if: ${{ !cancelled() && (matrix.app == 'chytai-web' || matrix.app == 'chytai-web-covers') && steps.encrypt.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view test-db >/dev/null 2>&1 || gh release create test-db --prerelease --latest=false \
            --title "Тестова копія бази сайту" \
            --notes "Очищена й зашифрована копія бази chytai-web для тестів, оновлюється щоночі; обкладинки окремо, щотижня. Без ключа нечитабельна. Як узяти: scripts/fetch-test-db.sh."
          if [ "$APP" = chytai-web-covers ]; then
            cp "$NAME.tar.gz.age" chytai-web-covers.tar.gz.age
            gh release upload test-db chytai-web-covers.tar.gz.age --clobber
            exit 0
          fi
          mkdir -p test/web
          python3 scripts/test-db-scrub.py check/web/chytai.db test/web/chytai.db
          tar czf test.tar.gz -C test .
          age -r "$AGE_RECIPIENT" -o chytai-web-test.tar.gz.age test.tar.gz
          ls -l chytai-web-test.tar.gz.age
          gh release upload test-db chytai-web-test.tar.gz.age --clobber
          rm -rf test test.tar.gz
      # Fly's own snapshots: show what exists and keep them 30 days (the default is 5).
      - name: Fly volume snapshots
        if: ${{ always() && matrix.dir == '/data' }}
        run: |
          for vol in $(flyctl volumes list -a "$FLY_APP" --json | jq -r '.[].id'); do
            flyctl volumes update "$vol" -a "$FLY_APP" --snapshot-retention 30 >/dev/null || echo "could not set retention on $vol"
            flyctl volumes show "$vol" -a "$FLY_APP" || true
            flyctl volumes snapshots list "$vol" -a "$FLY_APP" || true
          done
      # How it went, to the site (web/backups.js): kept for /admin and the morning report, and a failure goes to
      # Max's Telegram. A cancelled run (a newer one replaced it) says nothing.
      - name: Tell the site
        if: ${{ !cancelled() }}
        env:
          SITE_TOKEN: ${{ secrets.FLY_API_TOKEN_WEB }}
          SHAPE: ${{ matrix.exclude }}
          STEPS: ${{ toJSON(steps) }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          body=$(jq -n --argjson s "$STEPS" --arg app "$APP" --arg shape "$SHAPE" --arg run "$RUN" --argjson files "${FILES:-0}" --argjson bytes "${BYTES:-0}" '{
            app: $app, shape: $shape, run: $run, files: $files, bytes: $bytes,
            ok: ($s.upload.outcome == "success" and $s.restore.outcome == "success"),
            restored: ($s.restore.outcome == "success"),
            test: ({success: "ok", failure: "failed"}[$s.test.outcome // ""] // "skipped"),
            failed: [$s | to_entries[] | select(.value.outcome == "failure") | .key]
          }')
          echo "$body" | jq -c 'del(.run)'
          curl -sS --retry 4 --retry-all-errors -m 30 https://chytai.org.ua/agent/backup -H "Authorization: $SITE_TOKEN" \
            -H 'content-type: application/json' -d "$body" | jq -c 'del(.kept.run)' || echo "::warning::the site did not take the report"
