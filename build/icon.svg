<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2d42"/>
      <stop offset="1" stop-color="#14151f"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffaf0"/>
      <stop offset="1" stop-color="#f1e6cf"/>
    </linearGradient>
    <linearGradient id="spark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd76a"/>
      <stop offset="1" stop-color="#f0a020"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- macOS icon grid: 824px rounded square centred in 1024 -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <g filter="url(#shadow)">
    <!-- open book -->
    <path d="M512 330 C 440 285, 330 270, 230 285 L 230 705 C 330 690, 440 705, 512 750 Z" fill="url(#page)"/>
    <path d="M512 330 C 584 285, 694 270, 794 285 L 794 705 C 694 690, 584 705, 512 750 Z" fill="url(#page)"/>
    <path d="M512 330 L 512 750" stroke="#d9c7a3" stroke-width="6"/>
  </g>
  <!-- text lines -->
  <g stroke="#c9b48c" stroke-width="14" stroke-linecap="round">
    <path d="M290 390 Q 380 380 460 400"/>
    <path d="M290 450 Q 380 440 460 460"/>
    <path d="M290 510 Q 380 500 460 520"/>
    <path d="M290 570 Q 380 560 460 580"/>
    <path d="M564 400 Q 644 380 734 390"/>
    <path d="M564 460 Q 644 440 734 450"/>
  </g>
  <!-- highlighted phrase on the right page -->
  <path d="M556 508 Q 646 488 742 498 L 742 538 Q 646 528 556 548 Z" fill="#ffd54a" opacity="0.85"/>
  <path d="M564 580 Q 644 560 734 570" stroke="#c9b48c" stroke-width="14" stroke-linecap="round"/>
  <!-- AI sparkle -->
  <g transform="translate(742 268)" fill="url(#spark)">
    <path d="M0 -96 C 10 -30, 30 -10, 96 0 C 30 10, 10 30, 0 96 C -10 30, -30 10, -96 0 C -30 -10, -10 -30, 0 -96 Z"/>
    <path transform="translate(-118 -62) scale(0.34)" d="M0 -96 C 10 -30, 30 -10, 96 0 C 30 10, 10 30, 0 96 C -10 30, -30 10, -96 0 C -30 -10, -10 -30, 0 -96 Z"/>
  </g>
</svg>
