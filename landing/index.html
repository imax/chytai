<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chytai</title>
<link rel="icon" href="/img/icon.png">
<style>
  :root { --bg: #fff; --fg: #1d1d1f; --muted: #6e6e73; --accent: #b7791f; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1e1e20; --fg: #e6e6e6; --muted: #9a9aa0; --accent: #f0b429; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
         font: 17px/1.5 -apple-system, BlinkMacSystemFont, "Inter", "Helvetica Neue", sans-serif; }
  main { display: grid; gap: 18px; justify-items: center; padding: 24px; text-align: center; }
  .brand { display: flex; align-items: center; gap: 12px; font-size: 32px; font-weight: 600; letter-spacing: -0.02em; }
  .brand img { width: 44px; height: 44px; border-radius: 10px; }
  nav { display: flex; gap: 24px; }
  a { color: var(--accent); text-decoration: none; font-weight: 600; }
</style>
</head>
<body>
<main>
  <div class="brand"><img src="/img/icon.png" alt="">Chytai</div>
  <nav>
    <a href="https://chytai.fly.dev/demo">Демо</a>
    <a href="https://chytai.fly.dev/login">Увійти</a>
  </nav>
</main>
</body>
</html>
